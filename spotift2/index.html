<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist Music Player</title>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Spotify Playlist Music Player</h1>
    <P>Testing</P>
    <p>Login to spotify to access your playlist</p>
    <div class="button-spotify">
    <a href ="https://www.spotify.com" target="_blank"><i class="fa-brands fa-spotify fa-2xl" style="color: #1db954; "></i>
    </a><br><br><br>
    </div>
    <form id="playlistForm">
        <label for="playlistLink">Enter Spotify Playlist Link:</label><br>
        <input class="bar" type="text" id="playlistLink" placeholder=" paste here. ex. https://open.spotify.com/playlist/..." required>
        <button type="submit">Load Playlist</button>
    </form>

    <div class="music-player">
        <h2 id="playlistTitle">Playlist Title</h2>
        <div id="songList"></div>
        <iframe id="spotifyPlayer" width="100%" height="380" frameborder="0" allow="encrypted-media"></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
